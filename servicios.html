<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maca Polichino Studio — Servicios</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="topbar">

        <a href="index.html" class="brand">

            <div class="brand-small">
                MACA POLICHINO
            </div>

            <div class="brand-name">
                Studio<span>.</span>
            </div>

        </a>


        <nav class="main-nav">

            <a
                href="index.html"
                class="nav-link"
            >
                <span class="nav-icon">▣</span>
                Agenda
            </a>

            <a
                href="servicios.html"
                class="nav-link active"
            >
                <span class="nav-icon">✦</span>
                Servicios
            </a>

            <a
                href="profesionales.html"
                class="nav-link"
            >
                <span class="nav-icon">♟</span>
                Profesionales
            </a>

            <button
                type="button"
                class="nav-link"
            >
                <span class="nav-icon">●</span>
                Clientes
            </button>

            <button
                type="button"
                class="nav-link"
            >
                <span class="nav-icon">▰</span>
                Market
            </button>

            <button
                type="button"
                class="nav-link"
            >
                <span class="nav-icon">○</span>
                Mi cuenta
            </button>

        </nav>


        <button
            type="button"
            class="logout-button"
        >
            Salir
        </button>

    </header>


    <!-- =====================================================
         ACTION BAR
    ====================================================== -->

    <section class="action-bar">

        <div class="page-title">

            <h1>
                Servicios
            </h1>

            <p>
                Administrá los servicios que ofrece el estudio.
            </p>

        </div>


        <div class="actions">

            <button
                type="button"
                class="action-button primary"
                id="createServiceButton"
            >
                + Nuevo servicio
            </button>

        </div>

    </section>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main class="management-content">

        <section class="management-panel">

            <div class="management-header">

                <div>

                    <span class="section-label">
                        CONFIGURACIÓN
                    </span>

                    <h2>
                        Servicios del estudio
                    </h2>

                </div>

                <div class="management-counter">
                    <strong id="serviceCount">
                        0
                    </strong>
                    <span>servicios</span>
                </div>

            </div>


            <div
                id="servicesList"
                class="management-list"
            ></div>

        </section>

    </main>

</div>


<!-- =====================================================
     MODAL — SERVICIO
===================================================== -->

<div
    id="serviceModal"
    class="modal-overlay"
>

    <div class="modal small-modal">

        <div class="modal-header">

            <div>

                <span class="modal-kicker">
                    CONFIGURACIÓN
                </span>

                <h2 id="serviceModalTitle">
                    Nuevo servicio
                </h2>

            </div>

            <button
                type="button"
                class="close-modal"
                data-close="serviceModal"
                aria-label="Cerrar"
            >
                ×
            </button>

        </div>


        <form id="serviceForm">

            <div class="form-group">

                <label for="serviceName">
                    Nombre del servicio
                </label>

                <input
                    type="text"
                    id="serviceName"
                    placeholder="Ej. Lifting de pestañas"
                    required
                >

            </div>


            <div class="form-group">

                <label for="serviceProfessional">
                    Profesional
                </label>

                <select
                    id="serviceProfessional"
                    required
                ></select>

            </div>


            <div class="form-group">

                <label for="serviceCategory">
                    Categoría
                </label>

                <select id="serviceCategory">

                    <option value="Manos">
                        Manos
                    </option>

                    <option value="Pies">
                        Pies
                    </option>

                    <option value="Faciales">
                        Faciales
                    </option>

                    <option value="Cejas">
                        Cejas
                    </option>

                    <option value="Pestañas">
                        Pestañas
                    </option>

                    <option value="Corporales">
                        Corporales
                    </option>

                    <option value="Peluquería">
                        Peluquería
                    </option>

                    <option value="Otros">
                        Otros
                    </option>

                </select>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label for="servicePrice">
                        Precio
                    </label>

                    <input
                        type="number"
                        id="servicePrice"
                        placeholder="$ 0"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="serviceDuration">
                        Duración
                    </label>

                    <select id="serviceDuration">

                        <option value="30">
                            30 min
                        </option>

                        <option value="45">
                            45 min
                        </option>

                        <option value="60">
                            1 hora
                        </option>

                        <option value="90">
                            1:30 hs
                        </option>

                        <option value="120">
                            2 hs
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="button ghost"
                    data-close="serviceModal"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="button primary"
                    id="serviceSubmitButton"
                >
                    Crear servicio
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    class="toast"
></div>


<script src="./servicios.js"></script>

</body>
</html>
